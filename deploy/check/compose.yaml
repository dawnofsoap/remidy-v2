# Adds a TLS proxy in front of the production setup, so the image can be tested the way it runs.
# See apps/web/e2e-production. Not for real use.
services:
  proxy:
    image: caddy:2-alpine
    volumes:
      - ./check/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:8443:443
    depends_on:
      server:
        condition: service_healthy
