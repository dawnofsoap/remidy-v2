name: CI

on:
  pull_request:
  push:
    branches: [alpha, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Database schema and migrations match
        run: |
          pnpm db:generate --name=drift-check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            git status --porcelain packages/db/migrations
            echo "::error::schema.ts has changes with no migration. Run pnpm db:generate and commit the result."
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remidy/web exec playwright install --with-deps chromium
      - name: Start the full stack
        run: docker compose up --detach --build --wait --wait-timeout 300
      - run: pnpm e2e
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

  dev-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the app the way a new contributor would
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: Web app loads
        run: curl --fail --silent --show-error http://localhost:5173/ | grep -q 'id="root"'
      - name: Web reaches the server and database
        run: curl --fail --silent --show-error http://localhost:5173/api/health | grep -q '"status":"ok"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STACK: docker compose -p remidy-prodcheck -f deploy/compose.yaml -f deploy/check/compose.yaml --env-file deploy/check/check.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remidy/web exec playwright install --with-deps chromium
      - name: Build the image and start it behind TLS
        run: $STACK up --detach --build --wait --wait-timeout 300
      - run: pnpm --filter @remidy/web e2e:production
      - name: Show logs on failure
        if: failure()
        run: $STACK logs --no-color
      # Holds only the throwaway test stack's data, so it's safe to keep.
      - name: Keep the browser trace on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-trace
          path: apps/web/test-results
          retention-days: 7

  commit-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! echo "$TITLE" | head -n 1 | grep -Eq "$pattern"; then
            echo "::error::Title must follow Conventional Commits, for example: fix(payments): reject negative amounts"
            exit 1
          fi
